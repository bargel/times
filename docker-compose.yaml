services:
  times:
    container_name: times
    image: node:22
    volumes:
      - ./app:/app
      # Packages stay in the container: run as root there, they would be root-owned on the host.
      - node_modules:/app/node_modules
    ports:
      - 5174:5173
    working_dir: /app
    command: bash -c 'npm ci && npm run dev -- --host 0'
    # tty: true

volumes:
  node_modules:
