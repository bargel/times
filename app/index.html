<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="One moment in Vancouver, Kyiv and Warsaw, ready to paste into Discord." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1029" />
    <script>
      // Before the first paint, so a page kept in day or night never shows the other one for a
      // moment. Kept in step with src/lib/theme.ts.
      try {
        var theme = localStorage.getItem('pluacan-theme')
        if (theme === 'day' || theme === 'night') {
          document.documentElement.dataset.theme = theme
          var bar = theme === 'day' ? '#f3f7fb' : '#0c1029'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = bar
          })
        }
      } catch (blocked) {
        // Storage off limits: the page follows the device.
      }
    </script>
    <script>
      // An installed copy on iOS gets its real height only a moment after it starts, so the page
      // would jump: hold last launch's height from the first frame. See src/lib/heldViewport.ts.
      try {
        if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
          var kept = JSON.parse(localStorage.getItem('pluacan-viewport') || 'null')
          var held = kept && kept[innerWidth > innerHeight ? 'landscape' : 'portrait']
          if (held && typeof held.height === 'number' && typeof held.bottom === 'number') {
            document.documentElement.style.setProperty('--held-height', held.height + 'px')
            document.documentElement.style.setProperty('--held-bottom', held.bottom + 'px')
          }
        }
      } catch (blocked) {
        // Nothing kept or storage off limits: the page takes the device's numbers as they come.
      }
    </script>
    <title>PLUACAN</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
